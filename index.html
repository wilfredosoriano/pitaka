/* ---------- Phase 2: guided tour ---------- */
.tour{position:fixed;inset:0;z-index:30}
.switch{width:51px;height:31px;border-radius:16px;background:var(--track);position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--fill)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--on)}
.lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
.lock .lt{font-size:20px;font-weight:600;text-align:center}

.pdots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px}
.keys button{width:76px;height:76px;border-radius:50%;background:var(--card);font-size:28px;font-weight:500;display:flex;align-items:center;justify-content:center}
.keys button:active{background:var(--track)}
.keys button:disabled{opacity:.35}
.keys .k0{grid-column:2}
.keys .kd{background:none}
.lock .lnk{height:44px;padding:0 14px;font-size:14px;font-weight:500;color:var(--muted)}

.tour-ring{position:fixed;border-radius:16px;box-shadow:0 0 0 3px #fff,0 0 0 9999px rgba(0,0,0,.6);pointer-events:none}

@media (prefers-reduced-motion:no-preference){.tour-ring,.tour-tip{transition:top .2s ease,left .2s ease,width .2s ease,height .2s ease}}
.icopick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.icopick button{aspect-ratio:1;min-height:40px;border-radius:14px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;color:var(--muted)}

/* wallet card deck: swipe left/right, next cards peek out behind */
.deck{position:relative;isolation:isolate;touch-action:pan-y;user-select:none;-webkit-user-select:none;margin-right:-4px}
.deck .sizer{width:calc(100% - 56px);aspect-ratio:1.6;max-height:230px;visibility:hidden}
.wc{position:absolute;top:0;left:0;width:calc(100% - 56px);aspect-ratio:1.6;max-height:230px;transform-origin:right center;will-change:transform,opacity;perspective:1200px}
/* the card flips around its vertical axis: front shows the balance, back has Details and QR */
.wc-in{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.wc.turned .wc-in{transform:rotateY(180deg)}
.wc-face{position:absolute;inset:0;border-radius:24px;padding:18px 20px;display:flex;flex-direction:column;text-align:left;color:var(--on);overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden;
 background:var(--fill);background:linear-gradient(135deg,var(--fill) 40%,color-mix(in srgb,var(--fill) 78%,var(--on)) 100%);
 border:1px solid color-mix(in srgb,var(--on) 12%,transparent);box-shadow:0 18px 32px -16px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.12)}
.wc-back{transform:rotateY(180deg);cursor:pointer}
/* Card with its own design image: the design owns the top and right (logo, chip, network mark), so all our text sits bottom left in white */
.wc-iname{display:none}
.wc-front.img{background:#111 center/cover no-repeat;border-color:rgba(255,255,255,.14);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.wc-front.img::before{background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 62%)}
.wc-front.img .wc-top,.wc-front.img .wc-mark,.wc-front.img .wc-type{display:none}
.wc-front.img .wc-iname{display:block;margin-top:auto;font-size:13px;font-weight:600;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wc-front.img .wc-bal{margin-top:0;font-size:22px;max-width:70%}
.wc-front.img .wc-foot{margin-top:1px;width:70%;justify-content:flex-start}
.wc-front.img .wc-foot>span:first-child{display:flex;gap:6px;align-items:baseline}

 const c=d.querySelector(`.wc[data-id="${id}"]`);if(c&&document.activeElement?.closest('.wc')===c)(flipped?c.querySelector('.wc-act'):c.querySelector('.wc-front')).focus({preventScroll:true})}
function unflip(){if(!flipped)return;flipped=null;document.querySelectorAll('.wc.turned').forEach(c=>c.classList.remove('turned'))}
function walletDeck(){wi=Math.max(0,Math.min(wi,S.wallets.length-1));
 return `<div class="deck" id="deck" role="group" aria-roledescription="carousel" aria-label="Wallets"><div class="sizer"></div>${S.wallets.map(walletCard).join('')}</div>
 ${S.wallets.length>1?`<div class="wdots">${S.wallets.map((w,i)=>`<button class="${i===wi?'on':''}" data-a="wdot" data-i="${i}" aria-label="Show ${esc(w.name)}"><i></i></button>`).join('')}</div>`:''}`}
// Lay out every card from a fractional position: 0 = first card in front. Cards ahead peek out to the right, smaller and faded; passed cards slide off to the left.
function deckPos(deck,pos){const cards=deck.querySelectorAll('.wc'),W=deck.clientWidth;
 cards.forEach((c,i)=>{const o=i-pos;let tx,sc,op,r=0;
  if(o<0){tx=o*W*1.05;sc=1+o*.04;op=Math.max(0,1+o*.9);r=o*6}
  else{const k=Math.min(o,2);tx=k*28;sc=1-k*.09;op=o>2?Math.max(0,1-(o-2)*2)*.4:1-k*.3}
  c.style.transform=`translateX(${tx}px) scale(${sc}) rotate(${r}deg)`;c.style.opacity=op;c.style.zIndex=o<0?200:100-Math.round(o*10);
  c.style.pointerEvents=op<.05?'none':'';const front=Math.round(pos)===i;cardTabs(c,front);c.setAttribute('aria-hidden',front?'false':'true')});
 const near=Math.round(pos);document.querySelectorAll('.wdots button').forEach((d,i)=>d.classList.toggle('on',i===near))}
function deckGo(){const d=$('#deck');if(!d)return;if(flipped&&S.wallets[wi]?.id!==flipped)unflip();d.classList.add('anim');deckPos(d,wi)}
function setupDeck(deck){const n=S.wallets.length;deckPos(deck,wi);if(n<2)return;
 let x0,y0,t0,id=null,drag=false,dx=0;
 deck.addEventListener('pointerdown',e=>{if(e.button)return;id=e.pointerId;x0=e.clientX;y0=e.clientY;t0=performance.now();drag=false;dx=0});
 deck.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;dx=e.clientX-x0;const dy=e.clientY-y0;
  if(!drag){if(Math.abs(dx)<8||Math.abs(dx)<Math.abs(dy)){if(Math.abs(dy)>10)id=null;return}drag=true;unflip();deck.classList.remove('anim');try{deck.setPointerCapture(id)}catch(_){}}
  let p=wi-dx/(deck.clientWidth*.8);if(p<0)p/=3;else if(p>n-1)p=n-1+(p-n+1)/3;deckPos(deck,p)});
 const end=e=>{if(e.pointerId!==id)return;id=null;if(!drag)return;deckDragged=true;setTimeout(()=>deckDragged=false,50);
  const v=dx/Math.max(1,performance.now()-t0),W=deck.clientWidth;
  if((dx<-W*.22||v<-.5)&&wi<n-1)wi++;else if((dx>W*.22||v>.5)&&wi>0)wi--;deckGo()};
 deck.addEventListener('pointerup',end);deck.addEventListener('pointercancel',end);
 deck.addEventListener('keydown',e=>{if(e.target.closest('.wc-back'))return;if(e.key==='ArrowRight'&&wi<n-1){wi++;deckGo();deck.querySelectorAll('.wc-front')[wi].focus()}else if(e.key==='ArrowLeft'&&wi>0){wi--;deckGo();deck.querySelectorAll('.wc-front')[wi].focus()}})}
// Wallets grid: press and hold a card, drag it to a new spot, let go to save the order (Home's cards follow it)
let gridDrag=false,gridSuppress=false;
function setupGrid(g){let st=null;
 const cancel=()=>{if(st){clearTimeout(st.timer);st=null}};
 g.addEventListener('pointerdown',e=>{const el=e.target.closest('.mcard');if(!el||e.button||S.wallets.length<2)return;
  st={el,pid:e.pointerId,x0:e.pageX,y0:e.pageY,px:e.pageX,py:e.pageY,drag:false};st.timer=setTimeout(start,e.pointerType==='mouse'?250:400)});
 g.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.pid)return;
  if(!st.drag){if(Math.hypot(e.pageX-st.x0,e.pageY-st.y0)>8)cancel();return}
  st.px=e.pageX;st.py=e.pageY;move()});
 const end=e=>{if(!st||e.pointerId!==st.pid)return;clearTimeout(st.timer);if(st.drag)drop();else st=null};
 g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
 g.addEventListener('contextmenu',e=>{if(e.target.closest('.mcard'))e.preventDefault()});
 function start(){const cards=[...g.querySelectorAll('.mcard')];
  st.drag=true;gridDrag=gridSuppress=true;st.cards=cards;st.orig=st.target=cards.indexOf(st.el);
  st.slots=cards.map(c=>{const r=c.getBoundingClientRect();return{x:r.left+scrollX,y:r.top+scrollY,w:r.width,h:r.height}});
  st.el.classList.add('lift');try{st.el.setPointerCapture(st.pid)}catch(_){}navigator.vibrate?.(10);move();
  const tick=()=>{if(!st?.drag)return;const y=st.py-scrollY,before=scrollY;if(y<90)scrollBy(0,-8);else if(y>innerHeight-130)scrollBy(0,8);
   const dy=scrollY-before;if(dy){st.py+=dy;move()}requestAnimationFrame(tick)};requestAnimationFrame(tick)}
 function move(){const{el,slots,orig}=st,dx=st.px-st.x0,dy=st.py-st.y0,o=slots[orig];
  el.style.transform=`translate(${dx}px,${dy}px) scale(1.05)`;
  const cx=o.x+o.w/2+dx,cy=o.y+o.h/2+dy;let t=0,best=Infinity;slots.forEach((s,k)=>{const d=Math.hypot(s.x+s.w/2-cx,s.y+s.h/2-cy);if(d<best){best=d;t=k}});
  if(t===st.target)return;st.target=t;
  // everyone else slides to where they'd sit if the card were dropped at t
  const order=st.cards.map((_,k)=>k).filter(k=>k!==orig);order.splice(t,0,orig);
  order.forEach((idx,k)=>{if(idx===orig)return;const a=slots[idx],b=slots[k];st.cards[idx].style.transform=b===a?'':`translate(${b.x-a.x}px,${b.y-a.y}px)`})}
 function drop(){const{el,slots,orig,target}=st,a=slots[orig],b=slots[target],st0=st.cards;st=null;gridDrag=false;
  el.classList.remove('lift');el.style.transform=`translate(${b.x-a.x}px,${b.y-a.y}px)`;
  setTimeout(()=>{if(target!==orig){const ids=st0.map(c=>c.dataset.id),[m]=ids.splice(orig,1);ids.splice(target,0,m);reorderShown(ids);persist()}render();setTimeout(()=>gridSuppress=false,50)},220)}
 // Keyboard: Alt + arrow keys move the focused card
 g.addEventListener('keydown',e=>{const el=e.target.closest('.mcard');if(!el||!e.altKey)return;const cols=getComputedStyle(g).gridTemplateColumns.split(' ').length,step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-cols,ArrowDown:cols}[e.key];if(!step)return;e.preventDefault();
  const ids=[...g.querySelectorAll('.mcard')].map(c=>c.dataset.id),i=ids.indexOf(el.dataset.id),j=Math.max(0,Math.min(ids.length-1,i+step));if(i===j)return;
  const[m]=ids.splice(i,1);ids.splice(j,0,m);reorderShown(ids);persist();render();$(`#wgrid .mcard[data-id="${m}"]`)?.focus()})}
// The grid may show only one group; put those wallets in the new order using the slots they already hold
function reorderShown(ids){const set=new Set(ids),by=Object.fromEntries(S.wallets.map(w=>[w.id,w]));let k=0;S.wallets=S.wallets.map(w=>set.has(w.id)?by[ids[k++]]:w)}

function budgetBar(spent,cur){
 const left=S.budget-spent,now=new Date();
 const dl=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1;
 const line=left<0?`<span style="color:var(--red)">Over budget by ${peso(-left)}</span>`
  :cur?`${peso(left)} left · about ${peso(Math.floor(left/dl/100)*100)} a day for ${dl} ${dl===1?'day':'days'}`:`${peso(left)} under budget`;
 return `<div class="bar" style="margin:12px 0 8px" role="img" aria-label="${Math.round(spent/S.budget*100)}% of budget used"><i style="width:${Math.min(100,spent/S.budget*100)}%${left<0?';background:var(--red)':''}"></i></div><div class="sub">${line}</div>`;
}
// Category budgets: spending this month per category, and the ones close to or over their limit
function catSpent(c,y,m,skip){return sum(S.tx.filter(t=>t.kind==='expense'&&t.id!==skip&&catOf(t)===c&&inMonth(t,y,m)))}

function catAlerts(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();
 const hot=Object.keys(S.cbud).map(c=>({c,sp:catSpent(c,y,m)})).filter(x=>x.sp>=S.cbud[x.c]*.8).sort((a,b)=>b.sp/S.cbud[b.c]-a.sp/S.cbud[a.c]);

// Recurring bills: each has a day of the month; "last" is the month it was logged or skipped
const ymLocal=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
function billDue(r){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),cur=ymLocal(n);if((r.last||'')>=cur)return null;

 return{dd,diff,label:diff<0?`${-diff} ${diff===-1?'day':'days'} late`:diff===0?'Due today':diff===1?'Due tomorrow':`Due in ${diff} days`,date:new Date(y,m,dd)}}
function billsCard(){const due=S.rec.map(r=>({r,d:billDue(r)})).filter(x=>x.d&&W(x.r.wallet)).sort((a,b)=>a.d.diff-b.d.diff);if(!due.length)return'';

 // For the current month, compare with the same number of days last month so it's fair
 const prev=sum(S.tx.filter(t=>t.kind==='expense'&&inMonth(t,py,pm,cur?now.getDate():0)));
 const pn=(cur?'this time in ':'')+monthName(py,pm),diff=spent-prev;

 const first=S.tx.length?new Date(Math.min(...S.tx.map(t=>Date.parse(t.at)))):now;
 const atFirst=y*12+m<=first.getFullYear()*12+first.getMonth();
 const by={};exp.forEach(t=>{const c=catOf(t);by[c]=(by[c]||0)+t.amt});for(const c in S.cbud)by[c]??=0;
 const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);

 const places=Object.values(pl).sort((a,b)=>b.a-a.a).slice(0,5);

 const hero=`<section class="blk"><div class="cap">Spent in ${monthName(y,m)}</div><div class="amt">${peso(spent)}</div>${cmp?`<div class="cap" style="margin-top:4px">${cmp}</div>`:''}</section>`;
 const bud=S.budget?`<div class="card"><div class="row"><span class="sub" style="font-size:14px">Budget ${peso(S.budget)} a month</span><button class="link" style="height:auto" data-a="budget">Edit</button></div>${budgetBar(spent,cur)}</div>`

let tour=null;
const onScreen=sel=>{for(const s of sel.split('|')){const e=document.querySelector(s);if(!e)continue;const b=e.getBoundingClientRect();if(b.width&&b.height)return e}return null};
function maybeTour(id,forSheet){
 if(tour||S.tips[id])return;
 setTimeout(()=>{
  if(tour||S.tips[id]||!!$('#scrim')!==!!forSheet)return;
  const steps=TOURS[id].filter(s=>onScreen(s.el));if(!steps.length)return;
  tour={id,steps,i:0};
  document.body.insertAdjacentHTML('beforeend',`<div class="tour" id="tour" role="dialog" aria-modal="true" aria-labelledby="tourT">
   <div class="tour-ring"></div>
   <div class="tour-tip"><div class="tour-arrow"></div><div class="t15" id="tourT"></div><div class="tour-d" id="tourD"></div>
    <div class="row"><span class="tiny" id="tourN"></span><div style="display:flex;gap:4px;align-items:center">
     <button class="tour-skip" data-tour-act="skip">Skip</button><button class="tour-next" data-tour-act="next">Next</button></div></div>
   </div></div>`);
  showStep();
 },450);
}
function showStep(){
 const st=tour.steps[tour.i],e=onScreen(st.el);if(!e)return nextStep();
 if(!e.closest('.navwrap'))e.scrollIntoView({block:'center'});
 const $id=id=>document.getElementById(id);
 $id('tourT').textContent=st.t;$id('tourD').textContent=st.d;$id('tourN').textContent=`${tour.i+1} of ${tour.steps.length}`;
 const next=document.querySelector('[data-tour-act="next"]');next.textContent=tour.i===tour.steps.length-1?'Done':'Next';
 placeTour();next.focus({preventScroll:true});requestAnimationFrame(placeTour);
}
function placeTour(){
 if(!tour)return;const e=onScreen(tour.steps[tour.i].el);if(!e)return;
 const b=e.getBoundingClientRect(),pad=6,gap=16,vw=innerWidth,vh=innerHeight;
 const ring=document.querySelector('.tour-ring'),tip=document.querySelector('.tour-tip'),arrow=document.querySelector('.tour-arrow');
 Object.assign(ring.style,{left:`${b.left-pad}px`,top:`${b.top-pad}px`,width:`${b.width+pad*2}px`,height:`${b.height+pad*2}px`,
  borderRadius:`${(parseFloat(getComputedStyle(e).borderTopLeftRadius)||10)+pad}px`});
 const tw=tip.offsetWidth,th=tip.offsetHeight;
 if(vw>=1024&&e.closest('.navwrap')){ // desktop sidebar: tip on the right
  const y=Math.min(Math.max(b.top+b.height/2-th/2,8),vh-th-8);
  Object.assign(tip.style,{left:`${b.right+pad+gap}px`,top:`${y}px`});
  Object.assign(arrow.style,{left:'-6px',top:`${Math.min(Math.max(b.top+b.height/2-y-7,14),th-28)}px`,bottom:'auto'});return;
 }
 const below=b.bottom+pad+gap+th<=vh-8||b.top-pad-gap-th<8;
 const x=Math.min(Math.max(b.left+b.width/2-tw/2,16),vw-tw-16);
 const y=below?Math.min(b.bottom+pad+gap,vh-th-8):b.top-pad-gap-th;
 Object.assign(tip.style,{left:`${x}px`,top:`${Math.max(8,y)}px`});
 Object.assign(arrow.style,{left:`${Math.min(Math.max(b.left+b.width/2-x-7,18),tw-32)}px`,top:below?'-6px':'auto',bottom:below?'auto':'-6px'});
}
function nextStep(){if(!tour)return;tour.i++;tour.i>=tour.steps.length?endTour():showStep()}
function endTour(){if(!tour)return;S.tips[tour.id]=true;persist();tour=null;document.getElementById('tour')?.remove()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tour-act]');if(b)b.dataset.tourAct==='next'?nextStep():endTour()});
// Esc only closes the tour, not the sheet under it
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tour){e.stopImmediatePropagation();endTour()}});
// capture, so scrolling inside a sheet keeps the ring in place too
addEventListener('resize',placeTour);addEventListener('scroll',placeTour,{passive:true,capture:true});

function openSheet(html){const k=sheet?.type||'',open=$('#scrim .sheet');
 if(open){const same=open.dataset.k===k;open.innerHTML=`<div class="grab"></div>${html}`;open.dataset.k=k;if(!same)open.scrollTop=0;return}
 document.body.insertAdjacentHTML('beforeend',`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" data-k="${k}"><div class="grab"></div>${html}</div></div>`);document.body.style.overflow='hidden'}
function closeSheet(keep){$('#scrim')?.remove();if(!keep){sheet=null;document.body.style.overflow=''}}
const sheetHead=t=>`<div class="row"><h2 class="h2" id="shT">${t}</h2><button class="rb ghost" data-a="close" aria-label="Close">${sv(I.x)}</button></div>`;

/* entry: expense / income / transfer */
function openEntry(kind,tx){
 const now=new Date();
 sheet=tx?{type:'entry',id:tx.id,kind:tx.kind,name:tx.name||'',amt:plain(tx.amt),wallet:tx.wallet,to:tx.to||'',date:dkey(new Date(tx.at)),at:tx.at,cat:tx.kind==='expense'?catOf(tx):null,catSet:true}
  :{type:'entry',kind:kind||'expense',name:'',amt:'',wallet:S.lastWallet&&W(S.lastWallet)?S.lastWallet:S.wallets[0]?.id||'',to:'',date:dkey(now),cat:null,catSet:false};
 if(sheet.kind==='transfer'&&!sheet.to)sheet.to=S.wallets.find(w=>w.id!==sheet.wallet)?.id||'';
 drawEntry();if(sheet.kind==='expense')maybeTour('entry',true);setTimeout(()=>{if(!tx)(sheet?.kind==='transfer'?$('#e-amt'):$('#e-name'))?.focus()},250);
}
function drawEntry(){

 const wdrop=(field,excl)=>{const list=S.wallets.filter(w=>w.id!==excl),cur=W(D[field]),open=D.dd===field;

 const recents=k==='expense'&&!D.id?[...new Set(sorted().filter(t=>t.kind==='expense'&&t.name).map(t=>t.name))].slice(0,6):[];
 const kinds=[['expense','Spend'],['income','Add money'],['transfer','Transfer']];
 const b=bal(D.wallet);
 openSheet(`${sheetHead(title)}
 ${D.id?'':`<div class="kindseg" role="radiogroup" aria-label="Type">${kinds.map(([v,l])=>`<button class="sel${k===v?' on':''}" role="radio" aria-checked="${k===v}" data-a="kind" data-v="${v}">${l}</button>`).join('')}</div>`}
 ${k==='transfer'?'':`<div><label class="lbl" for="e-name">${k==='income'?'Where it came from':'What you paid for'}</label><input class="field" id="e-name" maxlength="60" placeholder="${k==='income'?'Salary':'Groceries'}" value="${esc(D.name)}" autocomplete="off">

 <div><label class="lbl" for="e-amt">Amount</label><input class="field" id="e-amt" inputmode="decimal" placeholder="₱0.00" value="${esc(D.amt)}" style="font-weight:600;font-variant-numeric:tabular-nums"><div class="tiny over" id="e-over"></div></div>
 ${k==='expense'?`<div><span class="lbl">Category</span><div class="chips" role="radiogroup" aria-label="Category">${CATS.map(([id,l,ic])=>`<button class="sel${D.cat===id?' on':''}" role="radio" aria-checked="${D.cat===id}" data-a="cat" data-v="${id}">${sv(I[ic],16)}${esc(l)}</button>`).join('')}<button class="sel" data-a="newcat">${sv(I.plus,16)}New</button></div><div class="tiny" id="e-cb" style="margin-top:8px"></div></div>`:''}
 <div data-tour="payfrom"><span class="lbl">${k==='expense'?'Pay from':k==='income'?'Add to':'From'}</span>${wdrop('wallet')}</div>

 <div><label class="lbl" for="e-date">Date</label><input class="field" id="e-date" type="date" value="${D.date}" max="${dkey(new Date())}"></div>

 ${D.recId?`<p class="tiny" style="margin:0 4px">Logging your monthly bill. It's marked done for ${monthName(new Date().getFullYear(),new Date().getMonth())}.</p>`:''}
 <div class="err" id="e-err"></div>

function cbHint(){const el=$('#e-cb');if(!el)return;const c=sheet.cat,lim=c&&S.cbud[c];if(!lim){el.textContent='';return}
 const n=new Date(),left=lim-catSpent(c,n.getFullYear(),n.getMonth(),sheet.id);
 el.innerHTML=left<0?`<span style="color:var(--red)">${CAT[c].h} is over its limit by ${peso(-left)} this month</span>`:`${CAT[c].h}: ${peso(left)} left of ${peso(lim)} this month`}
// What a wallet can cover: its balance, or for pay later its available credit. null = no limit to check (pay later without a limit).
// When editing, the entry's own effect is added back first.
function canCover(wid,skip){const w=W(wid);if(!w)return null;let b=bal(wid);const t=skip&&S.tx.find(x=>x.id===skip);
 if(t&&t.kind!=='income'&&t.wallet===wid)b+=t.amt;if(t&&t.kind==='transfer'&&t.to===wid)b-=t.amt;
 if(w.type==='paylater')return w.limit?Math.max(0,w.limit-Math.max(0,-b)):null;return b}
function overInfo(D){if(D.kind==='income')return null;const a=toC(D.amt),c=canCover(D.wallet,D.id);if(!(a>0)||c===null||a<=c)return null;return{a,c,w:W(D.wallet)}}
function overHint(){const el=$('#e-over');if(!el)return;const o=overInfo(sheet);
 el.textContent=o?(o.w.type==='paylater'?`That's more than your ${S.hide?'available credit':peso(o.c)+' available'} on ${o.w.name}.`:`That's ${S.hide?'more':peso(o.a-o.c)+' more'} than ${o.w.name} has${S.hide?'':` (${peso(o.c)})`}.`):''}
function openOver(D,o){sheet={type:'over',back:D};const pl=o.w.type==='paylater';
 openSheet(`${sheetHead(pl?`Only ${S.hide?'₱•••':peso(o.c)} available on ${esc(o.w.name)}`:`${esc(o.w.name)} only has ${S.hide?'₱•••':peso(o.c)}`)}
 <p class="sub" style="font-size:14px;margin:0">${pl?`This is ${S.hide?'more':peso(o.a-o.c)+' more'} than your credit limit allows.`:`Saving this would leave it at ${S.hide?'below zero':peso(o.c-o.a)}. If you added money that isn't logged yet, update the balance first.`}</p>
 <button class="cta" data-a="overback">Pick another wallet</button>
 <button class="sec" data-a="overfix">${pl?'Update credit limit':`Update ${esc(o.w.name)}'s balance`}</button>
 <button class="sec" data-a="overok">Save anyway</button>`)}
function saveEntry(){
 const D=sheet,err=$('#e-err');const amt=toC(D.amt);
 if(D.kind!=='transfer'&&!D.name.trim()){err.textContent=D.kind==='income'?'Enter where the money came from':'Enter what you paid for';return}
 if(!(amt>0)){err.textContent='Enter an amount above 0';return}
 if(amt>99999999999){err.textContent='Enter a smaller amount';return}
 if(!W(D.wallet)){err.textContent='Pick a wallet';return}
 if(D.kind==='transfer'&&(!D.to||D.to===D.wallet||!W(D.to))){err.textContent='Pick a different wallet to move money to';return}
 if(!/^\d{4}-\d{2}-\d{2}$/.test(D.date)){err.textContent='Pick a date';return}
 // new entries that spend more than the wallet has ask first; edits only show the hint
 const ov=!D.id&&!D.force&&overInfo(D);if(ov){openOver(D,ov);return}
 let at;const today=dkey(new Date());
 if(D.at&&dkey(new Date(D.at))===D.date)at=D.at;
 else if(D.date===today)at=new Date().toISOString();
 else{const[y,m,d]=D.date.split('-').map(Number);at=new Date(y,m-1,d,12,0).toISOString()}
 const rec={id:D.id||uid(),kind:D.kind,name:D.name.trim(),amt,wallet:D.wallet,at};if(D.kind==='transfer')rec.to=D.to;
 if(D.kind==='expense')rec.cat=D.cat||guessCat(rec.name)||'others';
 if(D.id){const i=S.tx.findIndex(t=>t.id===D.id);S.tx[i]=rec}else S.tx.push(rec);
 // a new repeating bill starts counting from this entry's month; logging a due bill marks its month done
 const em=D.date.slice(0,7);
 if(D.rep&&!D.id&&D.kind==='expense')S.rec.push({id:uid(),name:rec.name,amt,wallet:D.wallet,cat:rec.cat,day:+D.date.slice(8,10),last:em});
 if(D.recId){const r=S.rec.find(x=>x.id===D.recId);if(r&&(r.last||'')<em)r.last=em}
 S.lastWallet=D.wallet;persist();closeSheet();render();
 toast(D.id?'Changes saved':D.kind==='expense'?`Spending saved${S.hide?'':`. ${wname(rec.wallet)}: ${peso(bal(rec.wallet))}`}`:D.kind==='income'?`Money added to ${wname(rec.wallet)}`:'Transfer done');
}

/* QR codes: read from a photo with jsQR, drawn again with qrcode-generator. Both load only when needed, and sw.js keeps them for offline use. */
const QRLIB={jsQR:['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js','sha384-hStSInNIZ8ljtOVrmrgf7zdHMapaLBWoSnPTtF0nzsybp4+LuhDz6sHuEVpWIX8o'],
 qrcode:['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js','sha384-lQXOAyZwHXE55JFyrOMB7nY2Wv+m5ZWNtJcHrd1rceRQXAYNLak8ukN5TjBTcIwz']};
const libP={};
function lib(name){return libP[name]??=new Promise((ok,no)=>{if(window[name])return ok(window[name]);const[src,sri]=QRLIB[name],el=document.createElement('script');
 el.src=src;el.integrity=sri;el.crossOrigin='anonymous';el.onload=()=>window[name]?ok(window[name]):no();el.onerror=()=>{delete libP[name];el.remove();no()};document.head.appendChild(el)})}
// Bank or e-wallet from the BIC code inside the QR (first 4 letters)
const BANKS={GXCH:'GCash',PAPH:'Maya',BNOR:'BDO',BOPI:'BPI',MBTC:'Metrobank',UBPH:'UnionBank',TLBP:'Landbank',SETC:'Security Bank',RCBC:'RCBC',CHBK:'China Bank',PNBM:'PNB',EWBC:'EastWest',AUBK:'AUB',DBPH:'DBP',PHTB:'PSBank'};
function payInfo(p){const o=validQR(p)&&tlv(p);if(!o)return{};let bank='';
 const subs=[];for(let t=26;t<=51;t++){const sub=o[String(t)]&&tlv(o[String(t)]);if(sub)subs.push(...Object.values(sub))}
 for(const v of subs){const m=/^([A-Z]{4})PH[A-Z0-9]{2}/.exec(v);if(m&&BANKS[m[1]]){bank=BANKS[m[1]];break}}
 if(!bank){const t=subs.join(' ').toLowerCase();bank=/paymaya|\bmaya\b/.test(t)?'Maya':/gcash|g-?xchange/.test(t)?'GCash':''}
 return{name:(o['59']||'').trim(),bank}}
async function readQR(file){const jsQR=await lib('jsQR');
 const img=await new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);no()};i.src=u});
 // Screenshots are big: try a smaller copy first (fast), then full size
 for(const max of [1400,3000]){const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
  const r=jsQR(x.getImageData(0,0,w,h).data,w,h);if(r?.data)return r.data;if(k===1)break}
 return null}
async function qrMatrix(p){const qrcode=await lib('qrcode');qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];const q=qrcode(0,'M');q.addData(p);q.make();return q}
// Center logo area in module units (quiet zone of 4 included). About 5% of the code's area, well under what level H can recover.
// Card designs: icons/<id>.png (960x600-ish) becomes the card front, and a small thumbnail in the Wallets list
const CARDS={};
// A wallet with no bank picked, or whose card image is missing, uses icons/default.png
const cardImg=id=>CARDS[id]??=fetch(`icons/${id}.png`).then(r=>r.ok?`icons/${id}.png`:'').catch(()=>'').then(u=>u||(id!=='default'?cardImg('default'):''));
function fillCards(){document.querySelectorAll('[data-card]:not(.img)').forEach(el=>cardImg(el.dataset.card).then(u=>{if(u){el.classList.add('img');el.style.backgroundImage=`url("${u}")`}}))}
// Which bank a QR is from: what the QR says, else a bank name in the wallet name or QR label ("Maya savings")
function bankOf(p,hint){let b=payInfo(p).bank;if(!b&&hint){const h=hint.toLowerCase();b=Object.values(BANKS).sort((x,y)=>y.length-x.length).find(n=>h.includes(n.toLowerCase()))||''}return b}
const slug=b=>b.toLowerCase().replace(/[^a-z0-9]/g,'');
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
function fillQR(){document.querySelectorAll('.qrbox[data-qr]').forEach(async el=>{
 try{const q=await qrMatrix(el.dataset.qr),n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+4} ${r+4}h1v1h-1z`;
  el.innerHTML=`<svg viewBox="0 0 ${n+8} ${n+8}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
 catch(e){el.textContent="Couldn't load the QR. Go online once, then try again."}})}
// hint: the wallet name or QR label, used to name the bank when the QR doesn't
function qrPanel(q,hint=''){const inf=payInfo(q.p),bank=bankOf(q.p,hint);
 return `<div class="qrcard"><div class="qrbox" data-qr="${esc(q.p)}" data-hint="${esc(hint)}">Loading QR…</div><div><div class="t15">${esc(inf.name||'Name not shown in this QR')}</div><div class="sub" style="margin-top:2px">${esc([bank,q.acct].filter(Boolean).join(' · ')||'QR Ph')}</div></div></div>`}
// The QR that the open sheet is showing, with a title for the saved image
function curQR(){if(sheet?.type==='wqr'){const w=W(sheet.id);return w?.qr&&{q:w.qr,title:w.name,hint:w.name}}
 if(sheet?.type==='person'){const x=P(sheet.id),q=x?.qrs.find(q=>q.id===sheet.q);return q&&{q,title:x.name,hint:q.label}}}
async function saveQRImage(){const c=curQR();if(!c)return;let q;try{q=await qrMatrix(c.q.p)}catch(e){toast("Couldn't load the QR. Go online once, then try again.");return}
 const inf=payInfo(c.q.p),n=q.getModuleCount(),W0=1080,H0=1320,cell=Math.floor(840/(n+8)),size=cell*(n+8),ox=(W0-size)/2,oy=120;
 const cv=document.createElement('canvas');cv.width=W0;cv.height=H0;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W0,H0);x.fillStyle='#000';
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(ox+(k+4)*cell,oy+(r+4)*cell,cell,cell);
 x.textAlign='center';x.font="600 52px Onest, -apple-system, sans-serif";x.fillText(inf.name||c.title,W0/2,oy+size+90,W0-120);
 x.fillStyle='#6b6b6b';x.font="400 38px Onest, -apple-system, sans-serif";x.fillText([bankOf(c.q.p,c.hint)||c.q.label,c.q.acct].filter(Boolean).join(' · ')||'QR Ph',W0/2,oy+size+150,W0-120);
 const blob=await new Promise(r=>cv.toBlob(r,'image/png')),fname=`${(c.title+' '+(c.q.label||inf.bank||'qr')).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'qr'}.png`,file=new File([blob],fname,{type:'image/png'});
 if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]})}catch(e){}return}
 const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=fname;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('QR image saved')}
function copyAcct(){const c=curQR();if(!c?.q.acct)return;navigator.clipboard?.writeText(c.q.acct).then(()=>toast('Number copied'),()=>toast("Couldn't copy. Press and hold the number instead."))}

/* people */

/* PIN lock: kept apart from the app data, so backups never carry it and a restore never locks you out */
const LKEY='pitaka:lock';
let LK=(()=>{try{const l=JSON.parse(localStorage.getItem(LKEY)||'null');return l&&l.hash&&l.salt?l:null}catch(e){return null}})();
function saveLock(){try{LK?localStorage.setItem(LKEY,JSON.stringify(LK)):localStorage.removeItem(LKEY)}catch(e){}}
async function pinHash(pin,salt){const d=new TextEncoder().encode(salt+':'+pin);
 if(crypto.subtle){const h=await crypto.subtle.digest('SHA-256',d);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
 let x=2166136261;for(const c of d)x=Math.imul(x^c,16777619)>>>0;return 'f'+x.toString(16)}
let lockSt=null,lockTick;
const LOCK_T={unlock:'Enter your PIN',set:'Create a 4-digit PIN',confirm:'Enter the PIN again',off:'Enter your current PIN',change:'Enter your current PIN'};
function showLock(mode){document.activeElement?.blur?.();lockSt={mode,pin:'',first:'',msg:'',err:false};drawLock()}
function hideLock(){lockSt=null;clearTimeout(lockTick);$('#lock')?.remove()}
function drawLock(shake){
 if(!lockSt)return;clearTimeout(lockTick);let el=$('#lock');
 if(!el){document.body.insertAdjacentHTML('beforeend','<div class="lock" id="lock" role="dialog" aria-modal="true" aria-label="PIN lock"></div>');el=$('#lock')}
 const st=lockSt,wait=st.mode!=='set'&&st.mode!=='confirm'&&LK?.until>Date.now();
 if(st.forgot){el.innerHTML=`<div class="logo">${LOGO(40)}</div><div class="lbox"><div class="lt">Forgot your PIN?</div>
  <p class="sub" style="font-size:15px;margin:0 0 8px">Pitaka has no account, so the PIN can't be reset or recovered. To use Pitaka again, erase everything on this device, then restore your latest backup file.</p>
  <button class="cta" style="background:var(--red);color:#fff" data-a="pinerase">${st.sure?'Yes, erase everything':'Erase all data'}</button><button class="sec" data-a="pinback">Back</button></div>`;return}
 const msg=wait?`Too many tries. Try again in ${Math.ceil((LK.until-Date.now())/1000)}s`:st.msg;
 el.innerHTML=`<div class="logo">${LOGO(40)}</div><div><div class="lt">${LOCK_T[st.mode]}</div><div class="lm${st.err||wait?' err':''}" aria-live="polite">${esc(msg)}</div></div>
  <div class="pdots${shake?' shake':''}" aria-label="${st.pin.length} of 4 digits entered">${[0,1,2,3].map(i=>`<i class="${i<st.pin.length?'on':''}"></i>`).join('')}</div>
  <div class="keys">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="${n===0?'k0':''}" data-a="pin" data-v="${n}"${wait?' disabled':''}>${n}</button>`).join('')}<button class="kd" data-a="pin" data-v="del" aria-label="Delete">${sv(I.back,26)}</button></div>
  ${st.mode==='unlock'?'<button class="lnk" data-a="pinforgot">Forgot PIN?</button>':'<button class="lnk" data-a="pincancel">Cancel</button>'}`;
 if(wait)lockTick=setTimeout(()=>{if(LK&&LK.until<=Date.now()){LK.until=0;saveLock()}drawLock()},1000);
}
function pinKey(v){const st=lockSt;if(!st||st.busy||(st.mode!=='set'&&st.mode!=='confirm'&&LK?.until>Date.now()))return;
 if(v==='del')st.pin=st.pin.slice(0,-1);else if(st.pin.length<4){st.pin+=v;st.msg='';st.err=false}
 drawLock();if(st.pin.length===4){st.busy=true;setTimeout(()=>pinDone().finally(()=>{st.busy=false}),140)}}
async function pinDone(){const st=lockSt,p=st.pin;
 if(st.mode==='set'){Object.assign(st,{mode:'confirm',first:p,pin:''});drawLock();return}
 if(st.mode==='confirm'){
  if(p!==st.first){Object.assign(st,{mode:'set',first:'',pin:'',msg:"PINs didn't match. Try again.",err:true});drawLock(true);return}
  const salt=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
  LK={salt,hash:await pinHash(p,salt),fails:0,until:0};saveLock();const ch=st.change;hideLock();render();toast(ch?'PIN changed':'PIN lock is on');return}
 // unlock, off, change: check the current PIN
 if(await pinHash(p,LK.salt)===LK.hash){LK.fails=0;LK.until=0;saveLock();
  if(st.mode==='unlock')hideLock();
  else if(st.mode==='off'){LK=null;saveLock();hideLock();render();toast('PIN lock is off')}
  else{Object.assign(st,{mode:'set',pin:'',change:true});drawLock()}
  return}
 LK.fails=(LK.fails||0)+1;if(LK.fails>=5){LK.fails=0;LK.until=Date.now()+30000}saveLock();
 Object.assign(st,{pin:'',msg:'Wrong PIN',err:true});drawLock(true);
}
// Lock again when the app comes back after a minute or more away
let hiddenAt=0;
function awayCheck(){if(!LK||!S.name||$('#lock'))return;if(hiddenAt&&Date.now()-hiddenAt>60000)showLock('unlock');hiddenAt=0}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')hiddenAt=Date.now();else awayCheck()});

 else if(t.id==='wl-name'){sheet.name=t.value;wlPrev()}else if(t.id==='wl-amt'){sheet.amt=t.value;wlPrev()}else if(t.id==='wl-goal')sheet.goal=t.value;else if(t.id==='wl-gby'){sheet.gby=t.value;t.parentNode.classList.toggle('has',!!t.value)}else if(t.id==='wl-lim'){sheet.lim=t.value;wlPrev()}
